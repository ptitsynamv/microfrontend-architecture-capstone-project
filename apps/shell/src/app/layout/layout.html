<div class="layout">
  @if (loadingRemote()) {
  <div class="progress" aria-hidden="true"></div>
  }
  <p class="visually-hidden" role="status">
    {{ loadingRemote() ? 'Loading instrument…' : '' }}
  </p>

  <fp-header class="header" />
  <fp-sidebar class="sidebar" />
  <main class="content" [attr.aria-busy]="loadingRemote()">
    <router-outlet />
  </main>
</div>
